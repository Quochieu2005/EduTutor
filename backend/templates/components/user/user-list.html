<section class="users-list users-login-list" aria-label="Danh sách tài khoản đăng nhập">
  <div class="users-toolbar">
    <div class="users-toolbar__filters">
      <label class="users-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <input type="search" placeholder="Tìm username hoặc email..." aria-label="Tìm người dùng" data-login-user-search />
      </label>
    </div>
    <p class="users-login-list__count" data-login-user-count>{{ login_users|length }} tài khoản</p>
  </div>

  <div class="users-table-wrap">
    <div class="users-table-scroll">
      <table class="users-table">
        <thead><tr><th>Username</th><th>Name</th><th>Email</th><th>Phone Number</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody data-login-user-body>
          {% for account in login_users %}
            <tr data-login-user-row>
              <td title="{{ account.username }}">{{ account.username }}</td>
              <td>—</td>
              <td title="{{ account.email }}">{{ account.email }}</td>
              <td>—</td>
              <td>—</td>
              <td>—</td>
            </tr>
          {% empty %}
            <tr class="users-no-results"><td colspan="6">Chưa có tài khoản người dùng.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</section>
