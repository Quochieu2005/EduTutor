<section class="chat-workspace" aria-label="Quản lý trò chuyện">

      <span class="chat-empty-state__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 10a2 2 0 0 1-2 2H7l-4 3V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6ZM20 9a2 2 0 0 1 2 2v10l-4-3h-7a2 2 0 0 1-2-2v-1"></path></svg>
