<section class="chat-panel" aria-label="Nội dung cuộc trò chuyện">
  <header class="chat-panel__header">
    <div class="chat-panel__person">
      <span class="chat-avatar chat-avatar--blue" data-current-avatar>MA<i></i></span>
      <div>
        <h2 data-current-name>Nguyễn Minh Anh</h2>
        <p><span data-current-role>Học viên</span> · <span data-current-status>Đang hoạt động</span></p>
      </div>
    </div>
    <div class="chat-panel__actions">
      <button class="chat-icon-button" type="button" aria-label="Gọi thoại"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2.1Z"></path></svg></button>
      <button class="chat-icon-button" type="button" aria-label="Thông tin người dùng"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></button>
      <button class="chat-icon-button" type="button" aria-label="Tùy chọn cuộc trò chuyện"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
    </div>
  </header>

  <div class="chat-messages" id="chat-messages" aria-live="polite">
    <div class="chat-day"><span>Hôm nay</span></div>
    <article class="chat-message chat-message--incoming">
      <div class="chat-message__bubble">Chào admin, em muốn đổi lịch học Toán tối nay sang ngày mai được không ạ?</div>
      <time>10:20</time>
    </article>
    <article class="chat-message chat-message--outgoing">
      <div class="chat-message__bubble">Chào Minh Anh, mình sẽ kiểm tra lịch của gia sư và hỗ trợ em ngay nhé.</div>
      <time>10:22 · Đã xem</time>
    </article>
    <article class="chat-message chat-message--incoming">
      <div class="chat-message__bubble">Dạ, em cảm ơn. Khung 19:00 ngày mai là phù hợp nhất ạ.</div>
      <time>10:24</time>
    </article>
  </div>

  <form class="chat-composer" id="chat-composer">
    <button class="chat-icon-button" type="button" aria-label="Đính kèm tệp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.5-9.5a4 4 0 0 1 5.7 5.7l-9.5 9.5a2 2 0 1 1-2.8-2.8l8.8-8.8"></path></svg></button>
    <label for="chat-message-input" class="sr-only">Nhập tin nhắn</label>
    <textarea id="chat-message-input" rows="1" placeholder="Nhập tin nhắn..." required></textarea>
    <button class="chat-composer__send" type="submit" aria-label="Gửi tin nhắn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg></button>
  </form>
</section>
