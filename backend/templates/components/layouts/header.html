<header class="admin-header" data-header>
    <div class="admin-header__inner">

        <!-- Sidebar toggle -->
        <button class="admin-icon-button" id="sidebar-toggle" type="button" aria-label="Thu gon thanh ben" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>
        </button>

        <span class="admin-header__separator" aria-hidden="true"></span>

        <button class="admin-icon-button admin-mobile-trigger" id="mobile-menu" type="button" aria-label="Mo menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"></path></svg>
        </button>

        <nav class="admin-nav" id="admin-nav" aria-label="Dieu huong chinh">
            <a class="admin-nav__link admin-nav__link--active" href="/admin/dashboard/">Overview</a>
            <a class="admin-nav__link" href="#">Customers</a>
            <a class="admin-nav__link" href="#">Products</a>
            <a class="admin-nav__link" href="#">Settings</a>
        </nav>

        <button class="admin-search" id="search-button" type="button" aria-label="Mo tim kiem" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
            <span>Search</span><kbd>Ctrl K</kbd>
        </button>

        <div class="admin-header__actions">
            <button class="admin-icon-button" id="theme-toggle" type="button" aria-label="Doi giao dien" aria-pressed="false">
                <svg class="admin-icon--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l1.41-1.41"></path></svg>
                <svg class="admin-icon--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.7 15.2A8.5 8.5 0 0 1 8.8 3.3 8.5 8.5 0 1 0 20.7 15.2Z"></path></svg>
            </button>
            {% include "layouts/notification-menu.html" %}
            <details class="admin-user-menu">
                <summary class="admin-avatar" id="user-menu-button" aria-label="Mo tai khoan">GU</summary>
                <div class="admin-user-menu__content" role="menu">
                    <div class="admin-user-menu__identity"><strong>Guest User</strong><small>admin@edututor.local</small></div>
                    <div class="admin-user-menu__separator"></div>
                    <a href="{% url 'profile' %}" role="menuitem">Profile <kbd>⇧⌘P</kbd></a>
                    <a href="#" role="menuitem">Billing <kbd>⌘B</kbd></a>
                    <a href="#" role="menuitem">Settings <kbd>⌘S</kbd></a>
                    <button type="button" role="menuitem">New Team</button>
                    <div class="admin-user-menu__separator"></div>
                    <button class="admin-user-menu__sign-out" type="button" role="menuitem">Sign out <kbd>⇧⌘Q</kbd></button>
                </div>
            </details>
        </div>
    </div>

    <div class="command-overlay" id="search-panel" hidden>
        <div class="command-dialog" role="dialog" aria-modal="true" aria-label="Tim kiem dashboard">
            <div class="command-input-wrap">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
                <input id="command-input" type="search" placeholder="Type a command or search..." autocomplete="off" aria-label="Type a command or search">
                <kbd>ESC</kbd>
            </div>

            <div class="command-list" id="command-list">
                <section class="command-group" data-group>
                    <h2>General</h2>
                    <button class="command-item" type="button" data-command="Dashboard"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Dashboard</button>
                    <button class="command-item" type="button" data-command="Tasks"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Tasks</button>
                    <button class="command-item" type="button" data-command="Apps"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Apps</button>
                    <button class="command-item" type="button" data-command="Chats"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Chats</button>
                    <button class="command-item" type="button" data-command="Users"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Users</button>
                </section>

                <section class="command-group" data-group>
                    <h2>Pages</h2>
                    <button class="command-item" type="button" data-command="Sign In"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Sign In</button>
                    <button class="command-item" type="button" data-command="Sign Up"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Sign Up</button>
                    <button class="command-item" type="button" data-command="Forgot Password"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Forgot Password</button>
                    <button class="command-item" type="button" data-command="Not Found"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Not Found</button>
                </section>

                <section class="command-group" data-group>
                    <h2>Other</h2>
                    <button class="command-item" type="button" data-command="Profile" data-route="{% url 'profile' %}"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Profile</button>
                    <button class="command-item" type="button" data-command="Account"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Account</button>
                    <button class="command-item" type="button" data-command="Notifications"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Notifications</button>
                    <button class="command-item" type="button" data-command="Help Center"><span class="command-item__arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span>Help Center</button>
                </section>

                <section class="command-group" data-group>
                    <h2>Theme</h2>
                    <button class="command-item" type="button" data-theme-command="light"><span class="command-item__icon">&#9728;</span>Light</button>
                    <button class="command-item" type="button" data-theme-command="dark"><span class="command-item__icon">&#9790;</span>Dark</button>
                    <button class="command-item" type="button" data-theme-command="system"><span class="command-item__icon">&#9638;</span>System</button>
                </section>
            </div>
        </div>
    </div>
</header>
