<aside class="admin-sidebar" id="admin-sidebar" aria-label="Sidebar">
    <div class="admin-sidebar__brand">
        <button class="admin-workspace" type="button" aria-label="Chon workspace">
            <span class="admin-workspace__mark">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"></path>
                </svg>
            </span>
            <span class="admin-workspace__copy"><strong>EduTutor</strong><small>Admin dashboard</small></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
        </button>
    </div>

    <div class="admin-sidebar__content">
        <section class="admin-sidebar__group">
            <h2>General</h2>
            <nav class="admin-sidebar__nav" aria-label="General">
                <a class="admin-sidebar__link{% if request.path == '/admin/dashboard/' or request.path == '/admin/dashboard' %} is-active{% endif %}" href="/admin/dashboard/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="8" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="15" width="7" height="6" rx="1"></rect></svg><span>Dashboard</span></a>
                <a class="admin-sidebar__link" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 10a2 2 0 0 1-2 2H7l-4 3V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6ZM20 9a2 2 0 0 1 2 2v10l-4-3h-7a2 2 0 0 1-2-2v-1"></path></svg><span>Chats</span><b>3</b></a>
                <a class="admin-sidebar__link{% if request.path == '/admin/users/' %} is-active{% endif %}" href="{% url 'users' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3.1a4 4 0 0 1 0 7.7M22 21v-2a4 4 0 0 0-3-3.9"></path></svg><span>Users</span></a>
            </nav>
        </section>

        <section class="admin-sidebar__group">
            <h2>Manage</h2>
            <nav class="admin-sidebar__nav" aria-label="Quản lý gia sư và lớp học">
                <a class="admin-sidebar__link" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a4 4 0 1 1-4 4 4 4 0 0 1 4-4Z"></path><path d="M4 21a8 8 0 0 1 16 0"></path><path d="m16 11 2 2 3-3"></path></svg><span>Quản lý &amp; Duyệt gia sư</span></a>
                <a class="admin-sidebar__link" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3"></circle><path d="M3 21v-2a6 6 0 0 1 12 0v2"></path><path d="M16 5h5M18.5 2.5v5"></path></svg><span>Giáo viên theo khu vực</span></a>
                <a class="admin-sidebar__link" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="M4 10h16M9 5v14"></path></svg><span>Quản lý lớp học</span></a>
                <a class="admin-sidebar__link" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg><span>Lịch học &amp; Lịch biểu</span></a>
            </nav>
        </section>

        <section class="admin-sidebar__group">
            <h2>Other</h2>
            <nav class="admin-sidebar__nav" aria-label="Other">
                <a class="admin-sidebar__link" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 15a2 2 0 0 0 .4 2.2l.1.1-2.8 2.8-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.2h-4v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2.8-2.8.1-.1A2 2 0 0 0 3.8 15 2 2 0 0 0 2 13H1V9h1a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1 2.8-2.8.1.1A2 2 0 0 0 7.6 3 2 2 0 0 0 9 1.6v-.2h4v.2A2 2 0 0 0 14.2 3a2 2 0 0 0 2.2-.4l.1-.1 2.8 2.8-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 20.6 9h1v4h-1A2 2 0 0 0 19 15Z"></path></svg><span>Settings</span><i>›</i></a>
                <button class="admin-sidebar__link admin-sidebar__settings-trigger" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 15a2 2 0 0 0 .4 2.2l.1.1-2.8 2.8-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.2h-4v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2.8-2.8.1-.1A2 2 0 0 0 3.8 15 2 2 0 0 0 2 13H1V9h1a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1 2.8-2.8.1.1A2 2 0 0 0 7.6 3 2 2 0 0 0 9 1.6v-.2h4v.2A2 2 0 0 0 14.2 3a2 2 0 0 0 2.2-.4l.1-.1 2.8 2.8-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 20.6 9h1v4h-1A2 2 0 0 0 19 15Z"></path></svg><span>Settings</span><i aria-hidden="true">&rsaquo;</i></button>
                <details class="admin-sidebar__native-settings"{% if request.path|slice:':15' == '/admin/setting/' or request.path == '/admin/profile/' %} open{% endif %}>
                    <summary class="admin-sidebar__link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19 15a2 2 0 0 0 .4 2.2l.1.1-2.8 2.8-.1-.1a2 2 0 0 0-2.2-.4 2 2 0 0 0-1.2 1.8v.2h-4v-.2a2 2 0 0 0-1.2-1.8 2 2 0 0 0-2.2.4l-.1.1-2.8-2.8.1-.1A2 2 0 0 0 3.8 15 2 2 0 0 0 2 13H1V9h1a2 2 0 0 0 1.8-1.2 2 2 0 0 0-.4-2.2l-.1-.1 2.8-2.8.1.1A2 2 0 0 0 7.6 3 2 2 0 0 0 9 1.6v-.2h4v.2A2 2 0 0 0 14.2 3a2 2 0 0 0 2.2-.4l.1-.1 2.8 2.8-.1.1a2 2 0 0 0-.4 2.2A2 2 0 0 0 20.6 9h1v4h-1A2 2 0 0 0 19 15Z"></path></svg><span>Settings</span><i aria-hidden="true">&rsaquo;</i></summary>
                    <ul class="admin-sidebar__subnav" aria-label="Settings">
                    <li><a href="{% url 'profile' %}" class="admin-sidebar__sub-link{% if request.path == '/admin/profile/' %} is-active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="4"></circle><path d="M2 21v-2a4 4 0 0 1 4-4h3"></path><circle cx="18" cy="15" r="3"></circle></svg><span>Profile</span></a></li>
                    <li><a href="{% url 'account-settings' %}" class="admin-sidebar__sub-link{% if request.path == '/admin/setting/account/' %} is-active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.7 6.3 1.6 1.6 3.1-3.1a6 6 0 0 1-7.1 8.3l-7.9 7.9a2.1 2.1 0 0 1-3-3l7.9-7.9a6 6 0 0 1 8.3-7.1Z"></path></svg><span>Account</span></a></li>
                    <li><a href="{% url 'appearance-settings' %}" class="admin-sidebar__sub-link{% if request.path == '/admin/setting/appearance/' %} is-active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a10 9 0 1 1 10-9 5 5 0 0 1-5 5h-2.3a1.7 1.7 0 0 0-1.4 2.8l.3.4A1.7 1.7 0 0 1 12 22Z"></path><circle cx="13.5" cy="6.5" r=".5"></circle><circle cx="17.5" cy="10.5" r=".5"></circle></svg><span>Appearance</span></a></li>
                    <li><a href="{% url 'notification-settings' %}" class="admin-sidebar__sub-link{% if request.path == '/admin/setting/notifications/' %} is-active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 21a2 2 0 0 0 3.4 0"></path><path d="M4 17h16a1 1 0 0 0 .7-1.7C19.4 14 18 12.5 18 8a6 6 0 0 0-12 0c0 4.5-1.4 6-2.7 7.3A1 1 0 0 0 4 17Z"></path></svg><span>Notifications</span></a></li>
                    <li><a href="{% url 'display-settings' %}" class="admin-sidebar__sub-link{% if request.path == '/admin/setting/display/' %} is-active{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg><span>Display</span></a></li>
                    </ul>
                </details>
                <a class="admin-sidebar__link" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 3-3 3M12 17h.01"></path></svg><span>Help Center</span></a>
            </nav>
        </section>
    </div>

    <div class="admin-sidebar__footer">
        <button class="admin-sidebar__user" type="button">
            <span class="admin-sidebar__avatar">GU</span>
            <span><strong>Guest User</strong><small>admin@edututor.local</small></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
        </button>
    </div>
</aside>
