<main class="sign-in-page">
  <div class="sign-in-page__progress" aria-hidden="true"><span></span></div>
  <div class="sign-in-page__content">
    <div class="sign-in-page__brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"></path></svg><h1>EduTutor Admin</h1></div>
    <section class="sign-in-card sign-in-card--forgot-password" aria-labelledby="reset-password-title">
      <header class="sign-in-card__header">
        <h2 id="reset-password-title">Đặt mật khẩu mới</h2>
        <p>Mật khẩu phải có ít nhất 8 ký tự.</p>
      </header>
      <form class="sign-in-form" method="post">
        {% csrf_token %}
        {% include "auth/auth-messages.html" %}
        <div class="sign-in-form__field sign-in-form__field--password">
          <label for="new-password">Mật khẩu mới</label>
          <div class="sign-in-form__password-wrap"><input id="new-password" name="new_password" type="password" minlength="8" autocomplete="new-password" required><button class="sign-in-form__show-password" data-auth-password-toggle type="button" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
        </div>
        <div class="sign-in-form__field sign-in-form__field--password">
          <label for="confirm-password">Xác nhận mật khẩu mới</label>
          <div class="sign-in-form__password-wrap"><input id="confirm-password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button class="sign-in-form__show-password" data-auth-password-toggle type="button" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></div>
        </div>
        <button class="sign-in-form__submit" type="submit">Cập nhật mật khẩu</button>
      </form>
    </section>
  </div>
</main>
