<main class="sign-in-page">
    <div class="sign-in-page__progress" aria-hidden="true"><span></span></div>
    <div class="sign-in-page__content">
        <div class="sign-in-page__brand">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"></path></svg>
            <h1>EduTutor Admin</h1>
        </div>
        <section class="sign-in-card sign-in-card--forgot-password" aria-labelledby="forgot-password-title">
            <header class="sign-in-card__header">
                <h2 id="forgot-password-title">Forgot Password</h2>
                <p>Nhập email Admin đã đăng ký để nhận mã OTP đặt lại mật khẩu.</p>
            </header>
            <form class="sign-in-form" data-forgot-password-form action="{% url 'forgot-password' %}" method="post">
                {% csrf_token %}
                {% include "auth/auth-messages.html" %}
                <div class="sign-in-form__field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ entered_email }}" placeholder="name@example.com" autocomplete="email" required>
                </div>
                <button class="sign-in-form__submit" type="submit">
                    Gửi mã OTP
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                    <span class="sign-in-form__loading-spinner" aria-hidden="true"></span>
                </button>
            </form>
            <div class="forgot-password-status" data-forgot-password-status role="status" aria-live="polite" hidden>
                <svg class="forgot-password-status__spinner" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" opacity="1"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(30 12 12)" opacity=".92"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(60 12 12)" opacity=".84"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(90 12 12)" opacity=".76"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(120 12 12)" opacity=".68"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(150 12 12)" opacity=".60"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(180 12 12)" opacity=".52"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(210 12 12)" opacity=".44"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(240 12 12)" opacity=".36"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(270 12 12)" opacity=".28"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(300 12 12)" opacity=".20"></rect>
                    <rect x="10.5" y="1" width="3" height="6" rx="1.5" transform="rotate(330 12 12)" opacity=".12"></rect>
                </svg>
                <strong>Đang gửi mã OTP...</strong>
            </div>
        </section>
    </div>
</main>
