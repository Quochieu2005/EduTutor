services:
  - type: web
    name: edututor-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Two modest threaded workers handle concurrent MongoDB/Atlas I/O without
    # multiplying memory usage excessively. Recycling limits long-lived leaks.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --worker-class gthread --workers 2 --threads 4 --timeout 60 --max-requests 1000 --max-requests-jitter 100
    healthCheckPath: /admin/sign-in
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: edututor
      # Optional but recommended: a managed Redis/Upstash connection shared by
      # all workers for cache and API throttling. Leave blank until provisioned.
      - key: REDIS_URL
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Public Clerk issuer used to verify browser session JWTs. Keep this
      # separate from CLERK_SECRET_KEY; the secret never belongs in Git.
      - key: CLERK_JWT_ISSUER
        value: https://smiling-squid-5756.clerk.accounts.dev
      - key: FRONTEND_URL
        value: https://edututor-xi.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://edututor-xi.vercel.app
