services:
  - type: web
    name: edututor-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Two workers let MongoDB/Atlas I/O from one admin request not block every
    # other visitor. Keep the number modest for Render's memory limits.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /admin/sign-in
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: edututor
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
